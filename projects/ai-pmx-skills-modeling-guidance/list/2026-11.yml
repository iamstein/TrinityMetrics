# PMx Skills Index, November 2026. Written by the monthly run; see Specification 2.
month: 2026-11
run_date: '2026-11-01'
criteria_version: 2
run:
  kind: scheduled monthly run, unattended, in a Claude Code cloud session (Claude Opus 5.5), on 2026-11-01
  judge_agreement:
    scope: the 18 skills rescored this month (9 whose files changed, 9 new); unchanged skills keep October's
      single-pass answers
    items_compared: 174
    items_agreed: 153
    share_agreed: 0.879
    by_item:
      R1: 0.667
      R2: 0.944
      R3: 1.0
      R4: 0.944
      R5: 0.944
      R6: 0.889
      R7: 0.778
      R8: 0.833
      R9: 0.917
      R10: 0.889
    below_threshold:
    - R1
    - R7
    - R8
    note: An item counts as disagreed when the two answers differ, including n against na. A third independent
      subagent decided all 21 disagreements.
  deviations:
  - api.openalex.org was unreachable from the session (the environment's network policy refused it). Expertise
    could not be measured for contributors added since October or for the nine new skills. Under Section
    4.5 those contributors score 0 and carry the authors-not-found flag. John Harrold's field h-index
    of 13 is October's OpenAlex record. The new outside user of K-Dense pkpd-modeling could not be checked
    for expert status and counts 1 point.
  - The rubric's first pass for the ten skills whose files changed was scored in the main session. For
    the eight new skills outside nlmixr2llm it ran in a forked subagent that shared the session's context.
    The second pass, the tie-break and the error audit were fresh subagents. All of them ran on the same
    model. Section 4.1 asks for the audit to use a different model.
  - Judge A and the two tie-break judges were given one reading of R1, under which handing named work
    to another skill counts and a statement of what the underlying software cannot do does not. Judge
    B was not given it.
  - The audit's finding on nlmixr2lib-extract's multiplicative sex effect was dropped because the text
    it quoted is correct. Every other audit finding was kept as reported.
  - Unchanged skills keep October's rubric answers and audit, which came from one pass. This month's audits
    of two rescored skills (nlmixr2llm estimation and nlmixr2lib extract-literature-model) found major
    errors that were already in their October files.
  - The test-retest rank correlation (Section 8) was not produced.
  - No benchmark score. Two evaluation resources now cover listed skills with expected answers, the nlmixr2llm
    vitals evaluation and the RConsortium admiral-adpc benchmark (issue 224). Running them needs model
    API access and R, which the run did not have.
  - GitHub code search was available with authentication. Each query returns at most 1,000 results, and
    the reported total varied between pages of the same query; discovery.yml records the first page's
    figure. The term nonmem also matches words such as nonmember, which accounts for most of its new hits.
  - The skill-to-category rule left the new nlmixr2llm design skill (PopED through babelmixr2) as a tool
    skill.
  - Use was measured for 2025-11-01 to 2026-11-01. The repository API is not open to this session, so
    use came from issue and pull-request search. The author of each item counts; commenters were not read
    individually. Account ages were checked with a user search on creation date. GitHub Discussions were
    not searched. No skill ships in a package with download statistics.
  - Bill Denney's three issues of 2026-05-25 still count for the four nlmixr2llm skills that existed then,
    as in October, although nlmixr2llm is an R package. They do not count for the design skill, which
    was added on 2026-10-23.
  - Installations were searched with one code search per skill on a phrase from its description, excluding
    the skill's own repository, known copies and repositories holding more than 25 skill files. Fifteen
    queries returned no hits, which may reflect gaps in the code-search index.
  - Large libraries found by discovery (aira 216 skills, X-Science 101, codex-science 460, LifeSciences
    61) were not read skill by skill. Only the skills that discovery's terms matched were considered.
  - Licences. simbiology-build-model's frontmatter points to a MathWorks licence page, while the repository's
    LICENSE.md is BSD-3-Clause text; the run took the repository licence. nvqsp is under a proprietary
    NVIDIA licence, so its licence check fails, but it is not flagged as unlicensed.
  - jinko-core's R7 to R10 changed from n to not applicable, following rubric.md's convention for skills
    without code. That convention was applied the same way to every skill rescored this month.
  - The jinko-skills commits come from a publishing bot and no authors are named in the repository, so
    E stays 0, as in October.
fixtures:
  passed: true
  detail: 'Both known errors were reported as major by the error audit, each run blind by a subagent told
    only to read the skill adversarially: the shrinkage rule that fixes omega (jaj42/nonmem-skill at 2a32fed)
    and the popk_estimation objective that leaves the omegas out of the likelihood (nahisaho/satori at
    20787d9). The satori auditor was told to check whether each estimation function estimates what it
    claims.'
