        evidence: 'Complete theophylline example: "fit <- nlmixr2(one.compartment, theo_sd, est = \"saem\",
          saemControl(print = 0))" (SKILL.md)'
      R8:
        answer: y
        evidence: 'skill-examples.yaml: "Runs the fenced R code blocks shipped in inst/agents and inst/skills";
          the estimation blocks are not in example_skips except two reference fragments.'
      R9:
        answer: y
        evidence: 'skill-examples.yaml scheduled run on main at 50f236a (2026-10-26): success.'
      R10:
        answer: n
        evidence: No stored outputs; the vitals evaluation writes to evals/logs/, which is git-ignored.
    errors:
    - severity: major
      quote: '"| BSV% near 0 or > 100% | ETA unsupported by data; remove it |" (SKILL.md; repeated in
        references/model-building.md)'
      reason: Between-subject variability above 100% CV is common for absorption, lag time or bioavailability
        and is not evidence that the data fail to support the ETA; removing it pushes real variability
        into other parameters and the residual error (Savic and Karlsson 2009; Mould and Upton 2013).
    - severity: major
      quote: '"ETA shrinkage > ~30% means individual ETAs (and EBE-based diagnostics) are unreliable for
        that parameter; consider removing it or note the caveat." (references/model-building.md)'
      reason: Shrinkage measures how little the design says about each individual, not whether the population
        variance exists; it is a reason to distrust EBE-based diagnostics, not to remove the ETA (Savic
        and Karlsson 2009). The same class of error as known-answer fixture 1.
