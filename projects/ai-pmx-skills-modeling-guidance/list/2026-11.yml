    errors:
    - severity: major
      quote: '"A1_val_batch[:, cl_index] = -cl                          # vary the CL entry" (SKILL.md)'
      reason: A1 entries are first-order rate constants, so the elimination entry must be -CL/V (and include
        any outflow); putting a clearance there treats CL as k with V = 1 (Gabrielsson and Weiner).
    - severity: minor
      quote: '"dA1[cl_index, 0] = -1.0              # d(A1_val[cl_index]) / d(CL)" (SKILL.md)'
      reason: The derivative of -CL/V with respect to CL is -1/V, so the sensitivities are scaled wrongly
        unless V = 1.
    - severity: minor
      quote: '"... indirect-response (turnover) models, or any DAE system. These are not" (SKILL.md)'
      reason: A turnover model with a linear drug effect is bilinear and fits the solver's form; only
        Emax or Imax drug functions fall outside it (Dayneka, Garg and Jusko 1993).
    - severity: minor
      quote: '"A1 = csr_matrix([[-0.3, 0.1], [0.3, -0.1]])" (SKILL.md)'
      reason: Each column sums to zero, so the labelled two-compartment model has no elimination.
