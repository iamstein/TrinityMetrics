    errors:
    - severity: major
      quote: '"| `Y = LOG(F) + EPS(1)` (log-transform-both-sides) | `Cc ~ prop(propSd)` (NONMEM \"additive
        on log scale\" ≡ proportional in linear space)" (references/nonmem-translation.md; repeated in
        SKILL.md and verification-checklist.md)'
      reason: Additive error on the log scale is a log-normal error model; proportional error matches
        it only approximately for small sigma, so the translation changes the likelihood and the simulated
        spread. lnorm() is the exact translation (nlmixr2 residual-error documentation).
    - severity: major
      quote: '"`S1 = V/1000` (or similar) is a NONMEM unit-rescaling shorthand: dose in mg, volume in
        L, concentration in mg/L is the canonical case." (references/nonmem-translation.md)'
      reason: With dose in mg and V in L, S1 = V/1000 gives predictions in ug/L (ng/mL), not mg/L; dropping
        S1 and declaring mg/L makes Cc 1000-fold smaller than the data (NONMEM Users Guide VI, scale parameters).
    - severity: major
      quote: '"`lktr` — log first-order transit rate constant (= n_transit / MTT for a chain of length
        n)." (references/parameter-names.md)'
      reason: In the transit-compartment model ktr = (n+1)/MTT; n/MTT shortens the absorption delay, most
        when n is small (Savic et al. 2007, J Pharmacokinet Pharmacodyn 34:711).
    - severity: major
      quote: '"# Replicates Figure 4 of <Author Year>: VPC of Cc vs. time by dose group." (references/vignette-template.md)'
      reason: Cc from rxSolve carries no residual error, so its percentiles are too narrow to compare
        with a published VPC, and the spread check against the paper can give the wrong conclusion (Bergstrand
        et al. 2011).
    - severity: minor
      quote: '"`expSd` (used with `~ lnorm(...)`; ... the SD applies on the exponentiated scale)" (references/parameter-names.md)'
      reason: In nlmixr2, lnorm(sd) puts the SD on the log scale.
    - severity: minor
      quote: '"etalcl ~ 0.186   # ... = 0.186 (43.1% CV)" (SKILL.md)'
      reason: 43.1% is sqrt(0.186); under the skill's own omega^2 = log(CV^2+1) rule the CV is 45.2%.
    - severity: minor
      quote: '"The `A(1) = ...` initialization in `$DES` translates to `<state>(0) <- ...`" (references/nonmem-translation.md)'
      reason: NONMEM sets initial amounts through A_0 in $PK; A(n) is read-only in $DES (NONMEM Users
        Guide VIII).
    - severity: minor
      quote: '"The PKNCA formula **must include a treatment grouping variable** (`conc ~ time | id/treatment`)"
        (SKILL.md)'
      reason: In PKNCA the term after "/" is the analyte, so this makes treatment an analyte; it also
        contradicts the skill's own pknca-recipes.md (PKNCA documentation).
    - severity: minor
      quote: '"The trajectory should monotonically approach the reported baseline (assuming a single stable
        attractor ...)" (references/endogenous-validation.md)'
      reason: A stable attractor can be approached with overshoot or oscillation, as in Friberg-type models,
        so the check would flag a correct model.
    - severity: minor
      quote: '"With large IIV on a non-linear response, the median of the transform sits above the transform
        of the median." (references/known-vignette-failure-patterns.md)'
      reason: The median is unchanged by a monotonic transform; a gap needs a non-monotonic response or
        several random effects, and its direction is not fixed.
