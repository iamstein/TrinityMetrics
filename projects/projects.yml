- title: "synpmx"
  subtitle: "R package"
  description: >
    Generating realistic synthetic PK/PD datasets, so that analysis workflows,
    teaching material, and tooling can be developed and shared without
    exposing real clinical data.
  categories: [R package]
  path: https://iamstein.github.io/synpmx/

- title: "xgx"
  subtitle: "Open-source resource"
  description: >
    Eploratory Graphics : a guide to the graphics that make
    pharmacokinetic and pharmacodynamic data interpretable, with worked
    examples for each figure type.
  categories: [R package]
  path: https://opensource.nibr.com/xgx/

- title: "xgxr"
  subtitle: "R package"
  description: >
    The R package behind xgx: helper functions for the axes, scales, and
    summaries that exploratory pharmacokinetic and pharmacodynamic graphics
    keep needing.
  categories: [R package]
  path: https://cran.r-project.org/package=xgxr

- title: "Faster first-in-human TCE studies"
  subtitle: "Working document"
  description: >
    Three ways to reach a biologically active dose sooner in a
    first-in-human T-cell engager study: escalating within a patient,
    finding the dose in healthy volunteers first, and starting higher on a
    better MABEL. The first is specified as a simulation, the second
    searched, the third a pointer.
  categories: [Immunology and T-cell engagers, Draft]
  path: tce-ipde/index.qmd

- title: "T-cell engagers and target-mediated drug disposition"
  subtitle: "Working document"
  description: >
    T-cell engagers are dosed far below the amount needed to saturate CD3,
    so the sharp concentration drop of target-mediated drug disposition
    should be the usual sight and is not. Four explanations, tested against
    the published population models, plus a parameter survey across the
    class.
  categories: [Immunology and T-cell engagers, Draft]
  path: tce-tmdd/index.qmd

- title: "TCE-CRS-tolerance"
  subtitle: "Working document"
  description: >
    Cytokine release syndrome risk often falls as step-up doses rise. Can the
    published epcoritamab tolerance model explain that, and can it be fit to
    publicly available data from approved T-cell engagers?
  categories: [Immunology and T-cell engagers, Draft]
  path: tce-crs-tolerance/index.qmd

- title: "One-page TCE dose-finding strategy"
  subtitle: "Working document"
  description: >
    A T-cell engager program owes twenty-one dose and regimen decisions and
    has nowhere that holds the list. One landscape page that does: where each
    decision stands, when it is due, what will answer it, whether the team
    agrees, and who decides. Narrowed from the Sander 2021 framework.
  categories: [Immunology and T-cell engagers, Draft]
  path: tce-dose-finding-strategy/index.qmd

- title: "ITP-PK-Platelet"
  subtitle: "Working document"
  description: >
    Can a model of pharmacokinetic and platelet-count data for a B-cell
    depleting agent, fit to a small dose escalation and expansion study in
    immune thrombocytopenia, select the Phase 2 dose?
  categories: [Immunology and T-cell engagers, Draft]
  path: itp-pk-platelet/index.qmd

- title: "B-cell indirect-response estimation"
  subtitle: "Working document"
  description: >
    Why the EC50 of a B-cell depleting antibody is so hard to estimate: where
